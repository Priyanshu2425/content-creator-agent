[project]
name = "videogen"
version = "0.0.0"
description = "Talking-head-first short-form video generator: declarative Composition JSON -> neutral IR -> render."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Foundation of the Composition + IR types (ADR 0001/0002/0003), built in Phase 1.
    "pydantic>=2.9",
]

[project.scripts]
# Reserved now; the command body lands in Phase 9 (see app/cli.py).
videogen = "videogen.app.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videogen"]
# The co-located Node/Remotion app is shelled out to at runtime, not packaged.
exclude = ["src/videogen/backends/remotion/project"]

# --- Lint / format -----------------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# --- Type check --------------------------------------------------------------
# Strict enough to meaningfully verify the Pydantic v2 models arriving in Phase 1.
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
explicit_package_bases = true
files = ["src", "tests"]
# Keep the Node project's tooling scoped to its own folder, off the Python type checker.
exclude = ['(^|/)node_modules/', 'backends/remotion/project/']

# --- Test --------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
